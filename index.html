<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fennec 3D</title>
<meta name="description" content="Fennec 3D — خدمات الطباعة ثلاثية الأبعاد">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f5;
    --grid: rgba(20, 32, 43, .06);
    --ink: #14202b;
    --muted: #5b6874;
    --card: #ffffff;
    --line: #d5dce4;
    --accent: #c8641e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161d;
      --grid: rgba(255, 255, 255, .05);
      --ink: #eaf0f6;
      --muted: #94a3b2;
      --card: #18212b;
      --line: #2a3643;
      --accent: #f0a35e;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    display: flex;
    justify-content: center;
    padding: 48px 20px 40px;
  }
  main { width: 100%; max-width: 460px; }

  header { text-align: center; margin-bottom: 32px; }
  .logo {
    width: 170px; margin: 0 auto 18px;
    background: #f3f2f1;           /* نفس خلفية الشعار */
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 14px 12px 10px;
  }
  .logo img { width: 100%; height: auto; display: block; }
  .logo .fallback {
    display: grid; place-items: center; aspect-ratio: 1;
    font-size: 40px; font-weight: 700; color: #14202b;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 700; letter-spacing: 0; }
  .bio { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.7; }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.link {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: inherit; text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  a.link:hover { border-color: var(--accent); transform: translateY(-2px); }
  a.link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .badge {
    flex: none;
    width: 42px; height: 42px; border-radius: 11px;
    display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 17px;
    font-family: system-ui, sans-serif;
    direction: ltr;
  }
  .label { flex: 1; font-size: 17px; font-weight: 500; }
  .hint { color: var(--muted); font-size: 14px; direction: ltr; }

  footer { margin-top: 36px; text-align: center; color: var(--muted); font-size: 14px; }

  @media (prefers-reduced-motion: reduce) {
    a.link { transition: none; }
    a.link:hover { transform: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" id="logo"></div>
    <h1 class="sr-only" id="name"></h1>
    <p class="bio" id="bio"></p>
  </header>
  <ul id="links"></ul>
  <footer id="footer"></footer>
</main>

function hintFor(url) {
  try {
    if (url.startsWith("mailto:")) return url.slice(7);
    return new URL(url).hostname.replace(/^www\./, "");
  } catch (e) { return ""; }
}

// Profile
document.getElementById("name").textContent = PROFILE.name;
document.getElementById("bio").textContent = PROFILE.bio;
document.getElementById("footer").textContent = PROFILE.footer;
document.title = PROFILE.name;
const logo = document.getElementById("logo");
const img = document.createElement("img");
img.src = PROFILE.photo || EMBEDDED_LOGO;
img.alt = PROFILE.name;
img.onerror = () => { img.onerror = null; img.src = EMBEDDED_LOGO; };
logo.appendChild(img);

// Links
const list = document.getElementById("links");
LINKS.filter(l => !l.hidden).forEach(l => {
  const s = STYLES[l.type] || STYLES.website;
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.className = "link";
  a.href = l.url;
  if (!l.url.startsWith("mailto:")) { a.target = "_blank"; a.rel = "noopener noreferrer"; }

  const badge = document.createElement("span");
  badge.className = "badge";
  badge.style.background = s.bg;
  badge.innerHTML = '<svg viewBox="0 0 ' + s.w + ' ' + s.h + '" width="22" height="22" fill="#fff" aria-hidden="true"><path d="' + s.d + '"/></svg>';
  badge.setAttribute("aria-hidden", "true");

  const label = document.createElement("span");
  label.className = "label";
  label.textContent = l.label;

  const hint = document.createElement("span");
  hint.className = "hint";
  hint.textContent = hintFor(l.url);

  a.append(badge, label, hint);
  li.appendChild(a);
  list.appendChild(li);
});
</script>
